name: Build LiteRT Android APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;28.2.13676358"

      - name: Prepare Flutter project
        working-directory: samples/litert/flutter
        run: |
          chmod +x tool/flutter_litert/vendor.sh
          chmod +x tool/fetch_models.sh
          bash tool/flutter_litert/vendor.sh
          bash tool/fetch_models.sh
          flutter pub get

      - name: Build release APK
        working-directory: samples/litert/flutter
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: litert-android-apk
          path: samples/litert/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
